[project]
name = "3d-printer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kevin", email = "kevin@stardust.live" }
]
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.16.0",
    "opencv-python>=5.0.0",
    "websockets>=17.4"
]

[project.scripts]
3d-printer = "3d_printer:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
